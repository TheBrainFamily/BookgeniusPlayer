    <title>Book Viewer</title>

  <body>
    <video id="cutscene-video" class="cutscene-video" playsinline></video>

    <div id="legacy">
      <video id="bg-video-a" class="bg-element" autoplay muted loop playsinline></video>
      <video id="bg-video-b" class="bg-element faded" autoplay muted loop playsinline></video>
      <div id="bg-image-a" class="bg-element faded"></div>
      <div id="bg-image-b" class="bg-element faded"></div>

      <p id="cutscene-text"></p>

      <div id="book-container" class="flex flex-row gap-2 justify-center mx-auto pl-2 pr-2 md:pr-0 xl:px-4 md:pl-4 max-w-[120rem] w-full">
        <div id="left-notes" class="hidden md:block md:flex-1 max-w-[700px] content-center overflow-y-auto"></div>
        <div id="content-container" class="flex-2 md:min-w-[600px] max-w-[900px]"></div>
        <div id="right-notes" class="hidden xl:block xl:flex-1 max-w-[700px] pointer-events-none">
          <div id="right-notes-scrollable-container"></div>
        </div>
      </div>

      <div class="notes-edge-indicator" id="notes-edge-indicator"></div>
      <div class="notes-overlay" id="notes-overlay"></div>

      <!-- Menu overlay -->
      <div id="menu-overlay" class="modal-overlay">
        <div class="menu-container">
          <div class="menu-content">
            <button id="toggle-night-mode-button" class="menu-item">Night Mode (M)</button>
            <button id="open-chapters-button" class="menu-item">Open Chapter</button>
            <button id="go-to-page-button" class="menu-item">Go to Page</button>
          </div>
        </div>
      </div>

      <!-- Character Action Modal -->
      <div id="character-modal" class="modal-overlay">
        <div class="modal-container">
          <div class="modal-header">
            <div class="modal-title">Character Options</div>
            <button class="modal-close">&times;</button>
          </div>
          <div class="modal-content">
            <div id="character-info">
              <video autoplay loop id="modal-character-image" style="max-width: 100%; margin-bottom: 15px" />
              <h3 id="modal-character-name"></h3>
            </div>
          </div>
          <div class="modal-buttons">
            <button id="remove-character-button" class="modal-button danger-button">Remove Character</button>
            <button id="map-character-button" class="modal-button secondary-button">Map to Existing Character</button>
            <button id="create-image-button" class="modal-button primary-button">Create/Regenerate Image</button>
          </div>
        </div>
      </div>

      <!-- Character Mapping Modal -->
      <div id="mapping-modal" class="modal-overlay">
        <div class="modal-container">
          <div class="modal-header">
            <div class="modal-title">Select Existing Character</div>
            <button class="modal-close">&times;</button>
          </div>
          <div class="modal-content">
            <p>Select a character to map <strong id="source-character-name"></strong> to:</p>
            <div id="character-grid" class="character-grid">
              <!-- Character cards will be inserted here -->
            </div>
          </div>
          <div class="modal-buttons">
            <button id="cancel-mapping-button" class="modal-button secondary-button">Cancel</button>
            <button id="confirm-mapping-button" class="modal-button primary-button">Map Character</button>
          </div>
        </div>
      </div>

      <!-- return to location button -->
    </div>

    <div id="root">
      <div id="chapters-root"></div>
    </div>

    <div id="return-to-location-button" style="display: none">Go Back</div>
    <div id="deep-research-root"></div>

    <div id="splash">
      <img src="/loading.gif" alt="" width="100" height="100" />
      <div id="loading-phrase"></div>
    </div>

    <script type="module" src="/src/index-scripts.ts" async></script>
