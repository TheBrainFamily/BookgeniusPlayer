# Define all the services (containers) that make up the application
services:
  # Caddy: The reverse proxy and the single entry point for all external traffic.
  # It handles SSL in production and routes requests to the correct services.
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80" # HTTP port
      - "443:443" # HTTPS port
      - "443:443/udp" # Port for HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  player:
    image: ghcr.io/your-github-org/player:${IMAGE_TAG:-latest}
    restart: unless-stopped

  platform:
    image: ghcr.io/your-github-org/platform:${IMAGE_TAG:-latest}
    restart: unless-stopped

  core-api:
    image: ghcr.io/your-github-org/core-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      # Clerk authentication keys
      - CLERK_SECRET_KEY=sk_test_Nos0Znu6cKNInDkEd3xQOi3VvM6zROBQSSTsk7VZiL
      - CLERK_PUBLISHABLE_KEY=pk_test_bGl2aW5nLW5ld3QtODQuY2xlcmsuYWNjb3VudHMuZGV2JA
      # Snapplify configuration (to be provided during integration)
      - SNAPPLIFY_JWKS_URL=https://auth.snapplify.com/.well-known/jwks.json
      - SNAPPLIFY_ISSUER=https://snapplify.com
      - ASSET_CONTEXT=${ASSET_CONTEXT:-staging}


# Define named volumes to persist data
volumes:
  caddy_data:
  caddy_config:
