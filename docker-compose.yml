# Define all the services (containers) that make up the application
services:
  # Caddy: The reverse proxy and the single entry point for all external traffic.
  # It handles SSL in production and routes requests to the correct services.
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80" # HTTP port
      - "443:443" # HTTPS port
      - "443:443/udp" # Port for HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile # Mount the Caddy configuration file
      - caddy_data:/data
      - caddy_config:/config

  # Player: The frontend application service.
  player:
    build:
      context: .
      dockerfile: ./apps/player/Dockerfile
    restart: unless-stopped

  # NEW: The platform frontend service.
  platform:
    build:
      context: .
      dockerfile: ./apps/platform/Dockerfile
    restart: unless-stopped

  # Core API: The main backend service.
  core-api:
    build:
      context: .
      dockerfile: ./apps/core-api/Dockerfile
    restart: unless-stopped
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=bookgenius-assets

  # MinIO: A self-hosted, S3-compatible object storage server.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    ports:
      - "9090:9090"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Seed: A one-off service to upload initial data to MinIO.
  minio-seed:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb local/bookgenius-assets --ignore-existing && mc cp --recursive /data/assets/ local/bookgenius-assets/assets/ && echo '✅ MinIO seeding complete.' && exit 0"
    volumes:
      - ./build/s3-data:/data

# Define named volumes to persist data
volumes:
  caddy_data:
  caddy_config:
  minio_data:
