name: Cleanup Removed Branch

on:
  delete:

jobs:
  cleanup:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set branch slug
        id: branch
        run: |
          BRANCH_NAME=$(echo "${{ github.event.ref }}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_context=branches/${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

      - name: Run cleanup on server
        if: ${{ steps.branch.outputs.branch_name != 'main' }}
        run: bash delete-branch-asset.sh
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          ASSET_CONTEXT: ${{ steps.branch.outputs.asset_context }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

