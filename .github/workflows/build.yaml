name: Node.js CI

on: [push]

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1 # match your local pnpm
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "pnpm"

      - run: corepack enable

      - run: pnpm -v && node -v

      - run: pnpm install --frozen-lockfile
      # - run: pnpm test
      - run: pnpm typecheck:ci
      - run: pnpm lint:ci
      - run: pnpm prettier:check
      # - name: Build project
      #   run: pnpm build public_books/Krolowa-Sniegu
