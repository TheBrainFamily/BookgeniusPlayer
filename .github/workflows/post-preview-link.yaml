name: Post Preview Link (Reporter)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]

permissions:
  id-token: write
  contents: read
  issues: write
  deployments: write
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          BRANCH_BASE_DOMAIN: ${{ vars.BRANCH_BASE_DOMAIN }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const run = context.payload.workflow_run;

            // Find the PR for this commit SHA (works for internal PRs)
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: run.head_sha
            });
            if (!prs.data.length) return;
            const pr = prs.data[0];

            const branch = pr.head.ref.toLowerCase().replace(/[^a-z0-9]/g, '');
            const base = process.env.BRANCH_BASE_DOMAIN || 'branches.bookgenius.eu';
            const url = `https://${branch}.${base}/`;

            // Sticky comment
            const marker = '<!-- preview-url -->';
            const body = `${marker}\n**Preview ready:** ${url}`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
            const prev = comments.find(c => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }

            // Deployment button
            const dep = await github.rest.repos.createDeployment({
              owner, repo, ref: pr.head.sha,
              auto_merge: false, required_contexts: [],
              environment: `preview-${branch}`,
              description: 'Preview deployment',
              transient_environment: true, production_environment: false,
            });
            await github.rest.repos.createDeploymentStatus({
              owner, repo, deployment_id: dep.data.id,
              state: 'success', environment_url: url, log_url: url, auto_inactive: true,
            });
