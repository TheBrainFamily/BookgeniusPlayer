name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest-m
    environment: bookg
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Set dynamic environment variables
        id: set_vars
        run: |
          REPOSITORY=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPOSITORY=${REPOSITORY}" >> $GITHUB_ENV
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For Pull Requests
            BRANCH_NAME=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')
            echo "IMAGE_TAG=pr-${{ github.event.number }}-${BRANCH_NAME}" >> $GITHUB_ENV
            echo "ASSET_CONTEXT=staging/pr-${{ github.event.number }}-${BRANCH_NAME}" >> $GITHUB_ENV
            echo "IS_PRODUCTION=false" >> $GITHUB_ENV
          else
            BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "ASSET_CONTEXT=production" >> $GITHUB_ENV
            echo "IS_PRODUCTION=true" >> $GITHUB_ENV
          fi
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

      - name: Setup Bun and install dependencies
        uses: oven-sh/setup-bun@v1
      - run: pnpm install

      #      - name: Build local artifacts (for S3 upload)
      #        run: pnpm build:docker

      - name: Build
        run: pnpm build:docker:with-books
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CI: true

      - name: Deploy assets to Hetzner S3
        env:
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          ASSET_CONTEXT: ${{ env.ASSET_CONTEXT }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          FORCE: true
        run: bun run ./tools/scripts/deploy-s3.ts # Your Bun script for uploading

      - name: Delete books from build/player-app
        run: rm -rf build/player-app/books

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Deployment Docker Images
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker build -t ghcr.io/${{ env.REPOSITORY }}/gateway:latest --file ./apps/gateway/Dockerfile .
          docker build -t ghcr.io/${{ env.REPOSITORY }}/webhook:latest --file ./apps/webhook/Dockerfile ./apps/webhook

          docker push ghcr.io/${{ env.REPOSITORY }}/gateway:latest
          docker push ghcr.io/${{ env.REPOSITORY }}/webhook:latest

      - name: Build and Push Docker Images
        run: |
          docker build -t ghcr.io/${{ env.REPOSITORY }}/player:${{ env.IMAGE_TAG }} --file ./apps/player/Dockerfile .
          docker build -t ghcr.io/${{ env.REPOSITORY }}/platform:${{ env.IMAGE_TAG }} --file ./apps/platform/Dockerfile .
          docker build -t ghcr.io/${{ env.REPOSITORY }}/core-api:${{ env.IMAGE_TAG }} --file ./apps/core-api/Dockerfile .

          docker push ghcr.io/${{ env.REPOSITORY }}/player:${{ env.IMAGE_TAG }}
          docker push ghcr.io/${{ env.REPOSITORY }}/platform:${{ env.IMAGE_TAG }}
          docker push ghcr.io/${{ env.REPOSITORY }}/core-api:${{ env.IMAGE_TAG }}

      - name: Trigger deploy webhook
        env:
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            URL="https://wh.bookg.aws.lucetius.pl/deploy"
          else
            URL="https://wh.bookg.aws.lucetius.pl/deploy-main"
          fi

          payload=$(printf '{"branch":"%s","imageTag":"%s", "assetContext":"%s"}' "${{ env.BRANCH_NAME }}" "${{ env.IMAGE_TAG }}" "${{ env.ASSET_CONTEXT }}")

          curl -sS -X POST "$URL" \
            -H "x-api-key: ${WEBHOOK_TOKEN}" \
            -H "content-type: application/json" \
            -d "$payload"
