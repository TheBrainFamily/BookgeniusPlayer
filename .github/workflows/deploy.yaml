name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - deployment-improvments

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          titles=$(find public_books -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | \
                    jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Detected titles: $titles"
          printf 'matrix=%s\n' "$titles" >> "$GITHUB_OUTPUT"

  deploy:
    needs: generate-matrix
    runs-on: ubuntu-latest
    environment: lucetius
    strategy:
      matrix:
        title: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      DEPLOY_STATUS_DIR: ${{ vars.DEPLOY_STATUS_DIR }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Selective LFS pull
        run: |
          git lfs install
          git lfs pull --include="public_books/${{ matrix.title }},public"

          echo "Pointers:"
          grep -r "oid sha256" public_books/${{ matrix.title }} || echo "No pointers"

          echo "LFS files:"
          git lfs ls-files | grep public_books/${{ matrix.title }} || echo "No LFS files"

          echo "Book dir size:"
          du -sh public_books/${{ matrix.title }}

      - run: pnpm install

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run deployment script
        run: bash scripts/github-actions/build-and-deploy.sh ${{ matrix.title }} ${{ github.run_id }}

  book-links:
    needs: deploy
    runs-on: ubuntu-latest
    environment: lucetius

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_STATUS_DIR: ${{ vars.DEPLOY_STATUS_DIR }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Display matrix summary
        run: bash scripts/github-actions/display-summary.sh ${{ github.run_id }}
