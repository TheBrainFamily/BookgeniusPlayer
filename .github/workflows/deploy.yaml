name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Fetch all history for git diff to work correctly
          fetch-depth: 0

      - name: Set dynamic environment variables
        id: set_vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For Pull Requests
            BRANCH_NAME=$(echo ${{ github.head_ref }} | sed 's/[^a-zA-Z0-9]/-/g')
            echo "IMAGE_TAG=pr-${{ github.event.number }}-${BRANCH_NAME}" >> $GITHUB_ENV
            echo "ASSET_CONTEXT=staging/pr-${{ github.event.number }}-${BRANCH_NAME}" >> $GITHUB_ENV
            echo "IS_PRODUCTION=false" >> $GITHUB_ENV
          else
            # For pushes to main branch
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "ASSET_CONTEXT=production" >> $GITHUB_ENV
            echo "IS_PRODUCTION=true" >> $GITHUB_ENV
          fi

      - name: Setup Bun and install dependencies
        uses: oven-sh/setup-bun@v1
      - run: pnpm install

      - name: Build local artifacts (for S3 upload)
        run: pnpm build:docker

      - name: Deploy assets to Hetzner S3
        env:
          BRANCH_NAME: ${{ env.ASSET_CONTEXT }} # Pass context to the script
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: bun run ./tools/scripts/deploy-s3.ts # Your Bun script for uploading

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and Push Docker Images
        run: |
          docker build -t ghcr.io/${{ github.repository }}/player:${{ env.IMAGE_TAG }} --file ./apps/player/Dockerfile .
          docker build -t ghcr.io/${{ github.repository }}/platform:${{ env.IMAGE_TAG }} --file ./apps/platform/Dockerfile .
          docker build -t ghcr.io/${{ github.repository }}/core-api:${{ env.IMAGE_TAG }} --file ./apps/core-api/Dockerfile .

          docker push ghcr.io/${{ github.repository }}/player:${{ env.IMAGE_TAG }}
          docker push ghcr.io/${{ github.repository }}/platform:${{ env.IMAGE_TAG }}
          docker push ghcr.io/${{ github.repository }}/core-api:${{ env.IMAGE_TAG }}

      - name: Deploy to Hetzner Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ./deploy.sh "${{ env.ASSET_CONTEXT }}" "${{ env.IMAGE_TAG }}" "${{ secrets.GH_PAT }}"
