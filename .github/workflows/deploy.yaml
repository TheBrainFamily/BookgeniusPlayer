name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: cloudflare
    steps:
      - name: Set-up s5cmd
        uses: peak/action-setup-s5cmd@main
        with:
          version: v2.3.0

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Compute base/head SHAs
        id: sha
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$BASE"
          else
            BASE="${{ github.event.before }}"
            if [[ -n "$BASE" ]]; then
              git fetch --no-tags --depth=1 origin "$BASE"
            else
              git fetch --no-tags --depth=1 origin main
              BASE=$(git merge-base HEAD origin/main)
            fi
          fi
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "head=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set dynamic environment variables
        id: set_vars
        run: |
          REPOSITORY=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPOSITORY=${REPOSITORY}" >> $GITHUB_ENV
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For Pull Requests
            BRANCH_NAME=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')
            echo "ASSET_CONTEXT=branches/${BRANCH_NAME}" >> $GITHUB_ENV
            echo "IS_PRODUCTION=false" >> $GITHUB_ENV
            echo "DOMAIN=${BRANCH_NAME}.branches.bookgenius.net" >> $GITHUB_ENV
          else
            BRANCH_NAME=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')
            echo "ASSET_CONTEXT=prod" >> $GITHUB_ENV
            echo "IS_PRODUCTION=true" >> $GITHUB_ENV
            echo "DOMAIN=bookgenius.net" >> $GITHUB_ENV
          fi

      - name: Detect changed books / scripts
        id: changed
        run: |
          set -euo pipefail
          BASE="${{ steps.sha.outputs.base }}"
          HEAD="${{ steps.sha.outputs.head }}"

          mapfile -t files < <(git diff --name-only "$BASE" "$HEAD" -- apps/player/public_books/ apps/player/scripts/)
          printf '%s\n' "${files[@]}"

          REBUILD_ALL=0
          if printf '%s\n' "${files[@]}" | grep -q '^apps/player/scripts/'; then
            REBUILD_ALL=1
          fi

          mapfile -t books < <(printf '%s\n' "${files[@]}" | awk -F'/' '/^apps\/player\/public_books\//{print $4}' | sort -u)
          echo "rebuild_all=$REBUILD_ALL" >> $GITHUB_OUTPUT
          echo "books_csv=$(IFS=, ; echo "${books[*]}")" >> $GITHUB_OUTPUT

      - name: Install git-lfs (skip auto smudge)
        run: |
          git lfs install --local
          git config --local filter.lfs.smudge "git-lfs smudge --skip -- %f"
          git config --local filter.lfs.process "git-lfs filter-process --skip"

      - name: Initial git lfs pull for platform files
        run: git lfs pull -I "apps/platform/**"

      - name: Initial git lfs pull for wukong files
        run: git lfs pull -I "apps/wukong/**"

      - name: Selective git lfs pull
        if: ${{ steps.changed.outputs.rebuild_all == '1' || steps.changed.outputs.books_csv != '' }}
        run: |
          if [[ "${{ steps.changed.outputs.rebuild_all }}" == "1" ]]; then
            git lfs pull -I "apps/player/public_books/**"
          else
            IFS=, read -ra arr <<< "${{ steps.changed.outputs.books_csv }}"
            include=$(printf 'apps/player/public_books/%s/**,' "${arr[@]}")
            git lfs pull -I "${include%,}"
          fi

      - name: Export change set
        run: |
          echo "CHANGED_BOOKS=${{ steps.changed.outputs.books_csv }}" >> $GITHUB_ENV
          echo "REBUILD_ALL=${{ steps.changed.outputs.rebuild_all }}" >> $GITHUB_ENV
          echo "VITE_BUILD_TIME=${{ env.ASSET_CONTEXT }}-$(date +%s)" >> $GITHUB_ENV

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Bun and install dependencies
        uses: oven-sh/setup-bun@v1
      - run: pnpm install

      #      - name: Build local artifacts (for S3 upload)
      #        run: pnpm build:docker

      - name: Build web apps
        run: pnpm build:docker:front-only
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_AUTH_PROVIDER: ${{ vars.VITE_AUTH_PROVIDER }}
          VITE_PAYMENTS_PROVIDER: ${{ vars.VITE_PAYMENTS_PROVIDER }}
          VITE_SUPPORT_EMAIL: support@bookgenius.net
          CI: true

      - name: move bookgenius.net platform to dist-intl
        run: mv apps/platform/dist apps/platform/dist-intl

      - name: Build wukong
        run: pnpm build:wukong
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_AUTH_PROVIDER: ${{ vars.VITE_AUTH_PROVIDER }}
          VITE_PAYMENTS_PROVIDER: ${{ vars.VITE_PAYMENTS_PROVIDER }}
          VITE_SUPPORT_EMAIL: support@bookgenius.net
          VITE_IS_PRODUCTION: ${{ env.IS_PRODUCTION }}
          CI: true

      - name: Build snapplify platform
        run: pnpm build:platform
        env:
          VITE_AUTH_PROVIDER: "snapplify"
          VITE_PAYMENTS_PROVIDER: "default"
          VITE_SUPPORT_EMAIL: "support@snapplify.com"
          VITE_SNAPPLIFY_CLIENT_ID: "bookgenius.net"
          VITE_SNAPPLIFY_ISSUER: "https://auth.snapplify.com"
          VITE_SNAPPLIFY_REDIRECT_URI: "https://bookgenius.snapplify.com/auth/callback"
          VITE_IS_PRODUCTION: ${{ env.IS_PRODUCTION }}
          CI: "true"

      - name: move snapplify platform to dist
        run: mv apps/platform/dist apps/platform/dist-snapplify

      - name: build bookgeniusz.pl
        run: pnpm build:platform
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_BOOKGENIUSZ_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_BOOKGENIUSZ_SECRET_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_AUTH_PROVIDER: ${{ vars.VITE_AUTH_PROVIDER }}
          VITE_PAYMENTS_PROVIDER: ${{ vars.VITE_PAYMENTS_PROVIDER }}
          VITE_SUPPORT_EMAIL: support@bookgeniusz.pl
          VITE_IS_PRODUCTION: ${{ env.IS_PRODUCTION }}
          CI: true

      - name: Build books
        if: ${{ env.REBUILD_ALL == '1' || env.CHANGED_BOOKS != '' }}
        run: |
          if [[ "$REBUILD_ALL" == "1" ]]; then
            pnpm process-all-books
          else
            pnpm process-all-books -- --only="$CHANGED_BOOKS"
          fi

      - name: Prepare s3 folder
        run: pnpm prepare:docker

      - name: Deploy assets to S3
        env:
          ASSET_CONTEXT: ${{ env.ASSET_CONTEXT }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          PREVIEW_KEY: ${{ secrets.PREVIEW_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DOMAIN: ${{ env.DOMAIN }}
        run: bash ./update-cloudflare.sh

      - name: Emit deployed books list
        # only when some books were considered (changed or all)
        if: ${{ env.REBUILD_ALL == '1' || env.CHANGED_BOOKS != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [[ "${REBUILD_ALL}" == "1" ]]; then
            # list all slugs from repo
            mapfile -t books < <(ls -1 apps/player/public_books | sed '/^\./d' | sort)
            printf '%s\n' "${books[@]}" \
              | jq -R . | jq -s '{all:true, books:.}' > out/deployed_books.json
          else
            IFS=, read -ra arr <<< "${CHANGED_BOOKS}"
            printf '%s\n' "${arr[@]}" | sed '/^$/d' \
              | sort -u | jq -R . | jq -s '{all:false, books:.}' > out/deployed_books.json
          fi
          jq . out/deployed_books.json

      - name: Upload deployed-books artifact
        if: ${{ env.REBUILD_ALL == '1' || env.CHANGED_BOOKS != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: deployed-books
          path: out/deployed_books.json
          retention-days: 7
