<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Book Viewer" />
    <meta name="theme-color" content="#333333" />
    <meta name="description" content="Interactive book reader with character profiles" />

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167x167.png" />

    <!-- PWA Splash Screens for iOS -->
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-2048x2732.png"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-1668x2388.png"
      media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-1536x2048.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-1242x2688.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-640x1136.png"
      media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <link rel="stylesheet" type="text/css" href="/page_styles.css" />
    <link rel="stylesheet" type="text/css" href="/stylesheet.css" />
    <link rel="stylesheet" type="text/css" href="/src-book/styles.css" />
    <link rel="stylesheet" type="text/css" href="/src-book/output.css" />
    <!-- CSS_LINKS -->
    <style></style>
    <title>Book Viewer</title>
  </head>

  <body>
    <div id="legacy">
      <div id="loading">
        <div class="spinner"></div>
        <div>Loading book...</div>
      </div>

      <div id="book-container">
        <!-- Pages and notes containers will be inserted here by JavaScript -->
      </div>

      <div class="notes-edge-indicator" id="notes-edge-indicator"></div>
      <div class="notes-overlay" id="notes-overlay"></div>

      <!-- Menu overlay -->
      <div id="menu-overlay" class="modal-overlay">
        <div class="menu-container">
          <div class="menu-content">
            <button id="toggle-night-mode-button" class="menu-item">Night Mode (M)</button>
            <button id="open-chapters-button" class="menu-item">Open Chapter</button>
            <button id="go-to-page-button" class="menu-item">Go to Page</button>
          </div>
        </div>
      </div>

      <!-- Chapters modal -->
      <div id="chapters-modal" class="modal-overlay">
        <div class="modal-container">
          <div class="modal-header">
            <div class="modal-title">Chapters</div>
            <button class="modal-close">&times;</button>
          </div>
          <div class="modal-content">
            <div id="chapters-list" class="chapters-list">
              <!-- Chapters will be dynamically inserted here -->
            </div>
          </div>
        </div>
      </div>

      <!-- Go to page modal -->
      <div id="go-to-page-modal" class="modal-overlay">
        <div class="modal-container">
          <div class="modal-header">
            <div class="modal-title">Go to Page</div>
            <button class="modal-close">&times;</button>
          </div>
          <div class="modal-content">
            <div class="page-input-container">
              <input type="number" id="page-input" placeholder="Enter page number" />
              <button id="go-to-page-confirm" class="modal-button primary-button">Go</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Page number indicator that appears when typing numbers -->
      <div id="page-number-indicator"></div>

      <!-- Character Details Modal -->
      <div id="character-details-modal" class="modal-overlay">
        <div class="modal-container">
          <div class="modal-header">
            <div class="modal-title">Character Details</div>
            <button class="modal-close">&times;</button>
          </div>
          <div class="modal-content">
            <div id="character-details-info" style="text-align: center">
              <img id="modal-details-character-image" style="max-width: 100%; max-height: 300px; margin-bottom: 15px; cursor: pointer; display: block; margin: 0 auto" />
              <h3 id="modal-details-character-name" style="margin-bottom: 10px"></h3>
              <p id="modal-details-character-summary"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Character Action Modal -->
      <div id="character-modal" class="modal-overlay">
        <div class="modal-container">
          <div class="modal-header">
            <div class="modal-title">Character Options</div>
            <button class="modal-close">&times;</button>
          </div>
          <div class="modal-content">
            <div id="character-info">
              <img id="modal-character-image" style="max-width: 100%; margin-bottom: 15px" />
              <h3 id="modal-character-name"></h3>
            </div>
          </div>
          <div class="modal-buttons">
            <button id="remove-character-button" class="modal-button danger-button">Remove Character</button>
            <button id="map-character-button" class="modal-button secondary-button">Map to Existing Character</button>
            <button id="create-image-button" class="modal-button primary-button">Create/Regenerate Image</button>
          </div>
        </div>
      </div>

      <!-- Character Mapping Modal -->
      <div id="mapping-modal" class="modal-overlay">
        <div class="modal-container">
          <div class="modal-header">
            <div class="modal-title">Select Existing Character</div>
            <button class="modal-close">&times;</button>
          </div>
          <div class="modal-content">
            <p>Select a character to map <strong id="source-character-name"></strong> to:</p>
            <div id="character-grid" class="character-grid">
              <!-- Character cards will be inserted here -->
            </div>
          </div>
          <div class="modal-buttons">
            <button id="cancel-mapping-button" class="modal-button secondary-button">Cancel</button>
            <button id="confirm-mapping-button" class="modal-button primary-button">Map Character</button>
          </div>
        </div>
      </div>
    </div>

    <div id="react">
      <div id="chapters-root"></div>
    </div>
    <script src="/src-book/main.js"></script>
    <!-- PWA Service Worker Registration -->
    <script src="/pwa.js"></script>
  </body>
</html>
