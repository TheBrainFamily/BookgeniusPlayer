    server {
      listen 80;
      server_name *.bookg.aws.lucetius.pl bookg.aws.lucetius.pl;
      return 301 https://$host$request_uri;
    }

    server {
      server_name *.bookg.aws.lucetius.pl bookg.aws.lucetius.pl;
      set $upstream "";

      include /usr/local/openresty/nginx/conf/snippets/bookg.aws.lucetius.pl-ssl.conf;

      # /player/api/core/* and /api/core/* -> :api (strip prefix)
      location = /player/api/core { return 301 /player/api/core/; }
      location = /api/core { return 301 /api/core/; }
      location ~ ^/(player/)?api/core/ {
        access_by_lua_block {
          local lookup = require "redis_lookup"
          lookup.set_upstream("api")
        }
        rewrite ^/(?:player/)?api/core(?<rest>/.*)$ $rest break;
        include /usr/local/openresty/nginx/conf/snippets/upstream.conf;
      }

      # /player/* -> :player (strip /player)
      location = /player { return 301 /player/; }
      location ^~ /player/ {
        access_by_lua_block {
          local lookup = require "redis_lookup"
          lookup.set_upstream("player")
        }
        rewrite ^/player(?<rest>/.*)$ $rest break;
        include /usr/local/openresty/nginx/conf/snippets/upstream.conf;
      }

      # catch-all -> :platform
      location / {
        access_by_lua_block {
          local lookup = require "redis_lookup"
          lookup.set_upstream("platform")
        }
        include /usr/local/openresty/nginx/conf/snippets/upstream.conf;
      }
    }
