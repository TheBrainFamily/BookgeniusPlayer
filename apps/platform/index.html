<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BookGenius - Immersive Visual Novels</title>
    <meta
      name="description"
      content="Experience literature like never before with our collection of immersive visual novels featuring dynamic avatars, animations, and soundtracks"
    />
    <meta name="author" content="Virtual Library" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/app.webmanifest" />

    <!-- iOS Safari “web app” fullscreen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#2d2d2d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
      onload="this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@700&family=Libre+Caslon+Text&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        height: 100vh;
        margin: 0;
        background: #2d2d2d;
        scroll-behavior: smooth;
      }

      #platform-scope {
        height: 100vh;
      }

      #platform-scope section[id] {
        scroll-margin-top: 5rem;
      }

      #player-scope {
        position: absolute;
        inset: 0;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.3s ease-in-out,
          visibility 0s linear 0.3s;
      }

      #player-scope.visible {
        position: fixed;
        inset: 0;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 0.3s ease-in-out;
      }

      body:has(#player-scope.visible) {
        overflow: hidden;
        overscroll-behavior: none;
      }

      #fc_frame {
        position: fixed;
        bottom: 5px !important;
        right: 5px !important;
        width: 65px;
        height: 65px;
        opacity: 1;
        scale: 0.7;
        transition:
          opacity 0.15s ease-in-out,
          scale 0.15s ease-in-out;
        pointer-events: auto;
        transform-origin: bottom right;
      }

      #fc_frame.fc-open {
        scale: 1;
      }

      #fc_widget {
        width: 100%;
        height: 100%;
      }

      @media (max-width: 1280px) {
        body:has(#bottom-input-container[data-optional-element-visible="true"])
          #fc_frame:not(.fc-open) {
          opacity: 0;
          scale: 0.5;
          pointer-events: none;
        }
      }

      #content-container {
        font-size: calc(19px * var(--font-size-multiplier, 1));
        transition: font-size 0.2s ease-in-out;
      }

      @media (max-width: 768px), screen and (max-height: 550px) and (orientation: landscape) {
        #content-container {
          font-size: calc(17px * var(--font-size-multiplier, 1));
        }
      }

      .intercom-lightweight-app-launcher {
        box-sizing: border-box !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
      }

      .intercom-lightweight-app-launcher,
      .intercom-launcher-frame {
        opacity: 1 !important;
        pointer-events: auto !important;
        transition:
          transform 167ms cubic-bezier(0.33, 0, 0, 1),
          opacity 0.3s ease-in-out !important;
      }

      body:has(.book-loader-splash) {
        .intercom-lightweight-app-launcher,
        .intercom-launcher-frame {
          opacity: 0 !important;
          pointer-events: none !important;
        }
        .intercom-app > div {
          opacity: 0 !important;
          pointer-events: none !important;
        }

        /*localhost*/
        .intercom-dfosxs {
          opacity: 0 !important;
          pointer-events: none !important;
        }

        iframe[name="intercom-notifications-frame"] {
          opacity: 0 !important;
          pointer-events: none !important;
        }
      }

      body:has(#player-scope.visible):not(:has(#book-container.play-mode)) {
        @media (max-width: 1280px) {
          .intercom-lightweight-app-launcher,
          .intercom-lightweight-app-launcher-icon {
            width: 46px !important;
            height: 46px !important;
          }

          .intercom-lightweight-app-launcher,
          .intercom-launcher-frame {
            top: 16px !important;
            right: 8px !important;
          }
          .intercom-app > div {
            top: 15px !important;
            right: 8px !important;
            transform-origin: top right 0px;
          }
        }

        @media (max-width: 1024px) {
          .intercom-app > div ~ div {
            top: 16.5px !important;
            scale: 0.84;
          }

          .intercom-lightweight-app-launcher,
          .intercom-lightweight-app-launcher-icon {
            width: 42px !important;
            height: 42px !important;
          }

          .intercom-lightweight-app-launcher-icon-open svg {
            width: 20px !important;
            height: 20px !important;
          }
        }

        @media (max-width: 768px) {
          .intercom-lightweight-app-launcher,
          .intercom-lightweight-app-launcher-icon {
            width: 40px !important;
            height: 40px !important;
          }

          .intercom-lightweight-app-launcher-icon-open svg {
            width: 18px !important;
            height: 18px !important;
          }
        }
      }

      body:has(#player-scope.visible):has(#book-container.play-mode) {
        @media (max-width: 1024px) {
          .intercom-lightweight-app-launcher,
          .intercom-launcher-frame {
            top: 16px !important;
            right: 8px !important;
          }
          .intercom-app > div {
            top: 10px !important;
            right: 8px !important;
            transform-origin: top right 0px;
          }
          .intercom-app > div ~ div {
            top: 17px !important;
            scale: 0.84;
          }

          .intercom-lightweight-app-launcher,
          .intercom-lightweight-app-launcher-icon {
            width: 42px !important;
            height: 42px !important;
          }

          .intercom-lightweight-app-launcher-icon-open svg {
            width: 20px !important;
            height: 20px !important;
          }
        }

        @media (max-width: 768px) {
          .intercom-lightweight-app-launcher,
          .intercom-lightweight-app-launcher-icon {
            width: 40px !important;
            height: 40px !important;
          }

          .intercom-lightweight-app-launcher-icon-open svg {
            width: 18px !important;
            height: 18px !important;
          }
        }
      }
    </style>
  </head>

  <body>
    <div id="platform-scope">
      <div id="root"></div>
    </div>

    <!-- Player DOM elements are created dynamically by PlayerDOMProvider -->
    <div id="player-scope"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
