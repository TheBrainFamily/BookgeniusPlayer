<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookGenius - Immersive Visual Novels</title>
    <meta
      name="description"
      content="Experience literature like never before with our collection of immersive visual novels featuring dynamic avatars, animations, and soundtracks"
    />
    <meta name="author" content="Virtual Library" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" onload="this.rel='stylesheet'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@700&family=Libre+Caslon+Text&display=swap" rel="stylesheet" />

    <style>
      html,
      body {
        height: 100dvh;
        margin: 0;
        background: #2d2d2d;
        scroll-behavior: smooth;
      }

      #platform-scope {
        height: 100dvh;
      }

      #platform-scope section[id] {
        scroll-margin-top: 5rem;
      }

      #player-scope {
        position: absolute;
        inset: 0;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.3s ease-in-out,
          visibility 0s linear 0.3s;
      }

      #player-scope.visible {
        position: fixed;
        inset: 0;
        height: 100svh;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 0.3s ease-in-out;
      }

      body:has(#player-scope.visible) {
        height: 100svh;
        min-height: 100svh;
        overflow: hidden;
        overscroll-behavior: none;
      }

      #content-container {
        font-size: calc(16px * var(--font-size-multiplier, 1));
        transition: font-size 0.2s ease-in-out;
      }

      @media (max-width: 768px), screen and (max-height: 550px) and (orientation: landscape) {
        #content-container {
          font-size: calc(14px * var(--font-size-multiplier, 1));
        }
      }
    </style>
  </head>

  <body>
    <div id="platform-scope">
      <div id="root"></div>
    </div>

    <div id="player-scope">
      <video id="cutscene-video" class="cutscene-video" playsinline></video>

      <div id="legacy">
        <video id="bg-video-a" class="bg-element" autoplay muted loop playsinline></video>
        <video id="bg-video-b" class="bg-element faded" autoplay muted loop playsinline></video>

        <div id="bg-image-a" class="bg-element faded"></div>
        <div id="bg-image-b" class="bg-element faded"></div>

        <p id="cutscene-text"></p>
        <div id="book-container" class="flex flex-row gap-2 justify-center mx-auto px-0 max-w-[120rem] w-full">
          <div id="left-notes" class="hidden sm:block sm:flex-1 max-w-[700px] content-center overflow-y-auto"></div>
          <div id="content-container" class="sm:flex-3 max-w-[900px]"></div>
          <div id="right-notes" class="hidden xl:block xl:flex-1 max-w-[700px] pointer-events-none">
            <div id="right-notes-scrollable-container"></div>
          </div>
        </div>
      </div>

      <div id="root-player"></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
