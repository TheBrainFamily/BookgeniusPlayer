<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookGenius - Immersive Visual Novels</title>
    <meta name="description" content="Experience literature like never before with our collection of immersive visual novels featuring voice acting, animations, and soundtracks" />
    <meta name="author" content="Virtual Library" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@700&family=Libre+Caslon+Text&display=swap" rel="stylesheet" />

    <meta property="og:title" content="4ee05889-6b67-4bc7-af15-e6e1b3bee1e4" />
    <meta property="og:description" content="Lovable Generated Project" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <style>
      body {
        background-color: #2d2d2d;
      }

      #content-container {
        font-size: calc(16px * var(--font-size-multiplier, 1));
        transition: font-size 0.2s ease-in-out;
      }

      @media (max-width: 768px) {
        #content-container {
          font-size: calc(14px * var(--font-size-multiplier, 1));
        }
      }
    </style>
  </head>

  <body>
    <div id="root-platform"></div>

    <video id="cutscene-video" class="cutscene-video" playsinline></video>

    <div id="legacy">
      <video id="bg-video-a" class="bg-element" autoplay muted loop playsinline></video>
      <video id="bg-video-b" class="bg-element faded" autoplay muted loop playsinline></video>

      <div id="bg-image-a" class="bg-element faded"></div>
      <div id="bg-image-b" class="bg-element faded"></div>

      <p id="cutscene-text"></p>
      <div id="book-container" class="flex flex-row gap-2 justify-center mx-auto pl-2 pr-2 sm:pr-0 xl:px-4 sm:pl-4 max-w-[120rem] w-full">
        <div id="left-notes" class="hidden sm:block sm:flex-1 max-w-[700px] content-center overflow-y-auto"></div>
        <div id="content-container" class="sm:flex-3 max-w-[900px]"></div>
        <div id="right-notes" class="hidden xl:block xl:flex-1 max-w-[700px] pointer-events-none">
          <div id="right-notes-scrollable-container"></div>
        </div>
      </div>
    </div>

    <div id="root-player"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
