<!doctype html>

<html lang="<%= lang %>">
  <head>
    <meta charset="UTF-8" />
    <title>BookGenius - <%= title %></title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#333333" />
    <meta name="description" content="Interactive book reader" />

    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Book Viewer" />

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167x167.png" />

    <link rel="icon" type="image/x-icon" href="/bookgenius-fav.ico" />

    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@700&family=Libre+Caslon+Text&display=swap"
      rel="stylesheet"
    />

    <!-- Preloaded -->
    <link rel="preload" href="/clear-loader.png" as="image" />
    <style>
      body,
      html {
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #player-scope {
        background-color: #2d2d2d;
      }

      #player-scope.native-shell {
        background-color: transparent !important;
      }

      #player-scope.native-shell #legacy {
        background-color: transparent !important;
      }

      #player-scope.native-shell #book-container {
        background-color: transparent !important;
        box-shadow: none !important;
      }

      #content-container {
        font-size: calc(19px * var(--font-size-multiplier, 1));
        transition: font-size 0.2s ease-in-out;
      }

      @media (max-width: 768px), screen and (max-height: 550px) and (orientation: landscape) {
        #content-container {
          font-size: calc(17px * var(--font-size-multiplier, 1));
        }
      }

      #splash-screen {
        position: fixed;
        inset: 0;
        touch-action: none;
        overscroll-behavior: none;
        background-color: #2d2d2d;
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        z-index: 999999;
        overflow: hidden;
        padding: clamp(0.5rem, 4vw, 2rem);
        opacity: 1;
        visibility: visible;
        transition:
          opacity 1s ease-in-out,
          transform 1s ease-in-out,
          filter 1s ease-in-out,
          visibility 0s 1s;
      }

      #splash-screen.splash-screen--hide {
        opacity: 0;
        transform: scale(1.1);
        filter: brightness(1.5);
        pointer-events: none;
        visibility: hidden;
      }
    </style>
    <link rel="stylesheet" href="/src/styles/preload.css" />
  </head>

  <body id="player-scope">
    <video id="cutscene-video" class="cutscene-video" playsinline></video>

    <div id="legacy">
      <script>
        if (
          new URLSearchParams(window.location.search).get("nativeShell") === "true" ||
          window.ReactNativeWebView
        ) {
          document.getElementById("player-scope").classList.add("native-shell");
          document.getElementById("legacy").classList.add("native-shell");
        } else {
          document.write(
            '<video id="bg-video-a" class="bg-element" autoplay muted loop playsinline></video>',
          );
          document.write(
            '<video id="bg-video-b" class="bg-element faded" autoplay muted loop playsinline></video>',
          );
          document.write('<div id="bg-image-a" class="bg-element faded"></div>');
          document.write('<div id="bg-image-b" class="bg-element faded"></div>');
        }
      </script>

      <p id="cutscene-text"></p>
      <div
        id="book-container"
        class="flex flex-row justify-center mx-auto max-w-[120rem] w-full xl:px-2"
      >
        <div
          id="left-notes"
          class="hidden sm:block sm:flex-1 sm:w-auto max-w-[700px] content-center overflow-y-auto mr-2"
        ></div>
        <div
          id="content-container"
          class="max-w-[800px] sm:flex-3 xl:flex-none xl:w-[850px] xl:max-w-[850px] xxl:w-[900px] xxl:max-w-[900px]"
        ></div>
        <div
          id="right-notes"
          class="hidden xl:block xl:flex-1 max-w-[700px] pointer-events-none ml-2"
        >
          <div id="right-notes-scrollable-container"></div>
        </div>
      </div>
    </div>

    <div id="root-player"></div>

    <div id="splash-screen">
      <div class="splash-container">
        <div class="splash-title-container">
          <div class="splash-title"><%= title %></div>
          <div class="splash-subtitle"><%= subtitle %></div>
        </div>

        <div class="splash-image-container">
          <video
            id="splash-video"
            src="<%= loaderVideoSrc %>"
            poster="/clear-loader.png"
            alt="Loading..."
            class="splash-loading-image"
            muted
            autoplay
            playsinline
            preload="auto"
          ></video>
        </div>

        <div class="splash-text-container">
          <p class="splash-loading-text" id="loading-phrase"></p>
        </div>

        <button class="splash-start-button disabled" id="start-button">
          <div class="play-icon"></div>
          <span><%= startButtonText %></span>
        </button>
      </div>
    </div>

    <!-- SplashScreenController React component handles splash logic -->
    <script type="module" src="./src/index.tsx" async></script>
  </body>
</html>
