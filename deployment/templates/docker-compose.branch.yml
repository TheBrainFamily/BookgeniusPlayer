version: "3.9"
services:
  platform:
    image: ${IMAGE_PREFIX}/platform:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "172.17.0.1:${PLATFORM_HTTP}:80"

  player:
    image: ${IMAGE_PREFIX}/player:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "172.17.0.1:${PLAYER_HTTP}:80"

  core-api:
    image: ${IMAGE_PREFIX}/core-api:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "172.17.0.1:${API_HTTP}:3000"
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - SNAPPLIFY_JWKS_URL=${SNAPPLIFY_JWKS_URL}
      - SNAPPLIFY_ISSUER=${SNAPPLIFY_ISSUER}
      - ASSET_CONTEXT=${ASSET_CONTEXT:-staging}
