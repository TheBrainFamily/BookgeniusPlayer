# Local development services and overrides
# This file enables hot-reloading for a fast development workflow.
# Use with: docker-compose -f docker-compose.yml -f docker-compose.local.yml up --build

services:
  # --- Hot-Reloading Overrides for Your Applications ---

  player:
    # Tells Docker to build this service from source for local dev
    build:
      context: .
      dockerfile: ./apps/player/Dockerfile.dev
    # Mounts your local source code into the container.
    # Changes you make on your Mac are instantly reflected inside the container.
    volumes:
      - ./apps/player:/usr/src/app/apps/player
      - ./packages:/usr/src/app/packages # Mount shared packages as well
    # Exposes the Vite dev server port for direct access if needed
    ports:
      - "5173:5173"

  platform:
    build:
      context: .
      dockerfile: ./apps/platform/Dockerfile.dev
    volumes:
      - ./apps/platform:/usr/src/app/apps/platform
      - ./packages:/usr/src/app/packages
    ports:
      - "5174:5173" # Use a different host port to avoid conflicts

  core-api:
    # Overrides the command to use Bun's --hot flag for automatic restarts
    command: bun run --hot src/index.ts
    # Mounts the source code for the API
    volumes:
      - ./apps/core-api:/usr/src/app/apps/core-api
      - ./packages:/usr/src/app/packages
    # Overrides the production environment to point to local MinIO
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=bookgenius-assets

  # --- Development-Only Services (Unchanged) ---

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000" # MinIO API
      - "9090:9090" # MinIO Console
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-seed:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb local/bookgenius-assets --ignore-existing && mc cp --recursive /data/ local/bookgenius-assets/ && echo '✅ MinIO seeding complete.' && exit 0"
    volumes:
      - ./build/s3-data:/data

volumes:
  minio_data:
