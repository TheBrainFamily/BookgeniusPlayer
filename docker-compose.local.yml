  core-api:
    build:
      context: .
      dockerfile: ./apps/core-api/Dockerfile
    # Overrides the command to use Bun's --hot flag for automatic restarts
    command: bun run --hot src/index.ts
    # Mounts the source code for the API
    volumes:
      - ./apps/core-api:/usr/src/app/apps/core-api
      - ./packages:/usr/src/app/packages
    restart: unless-stopped
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      # Clerk authentication keys
      - CLERK_SECRET_KEY=sk_test_Nos0Znu6cKNInDkEd3xQOi3VvM6zROBQSSTsk7VZiL
      - CLERK_PUBLISHABLE_KEY=pk_test_bGl2aW5nLW5ld3QtODQuY2xlcmsuYWNjb3VudHMuZGV2JA
      # Snapplify configuration (to be provided during integration)
      - SNAPPLIFY_JWKS_URL=https://auth.snapplify.com/.well-known/jwks.json
      - SNAPPLIFY_ISSUER=https://snapplify.com
      - ASSET_CONTEXT=${ASSET_CONTEXT:-production}
      - CORE_BUNNY_TOKEN_KEY=${CORE_BUNNY_TOKEN_KEY}

# Define named volumes to persist data
volumes:
  caddy_data:
  caddy_config:
  minio_data:
