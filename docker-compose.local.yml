  #     retries: 3

  # minio-seed:
  #   image: minio/mc
  #   # depends_on:
  #   #   minio:
  #   #     condition: service_healthy
  #   entrypoint: /bin/sh
  #   command: -c "mc alias set local ${S3_ENDPOINT} ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY} && mc cp --recursive /data/ local/bookgenius/${ASSET_CONTEXT} && echo '✅ MinIO seeding complete.' && exit 0"
  #   volumes:
  #     - ./build/s3-data:/data
  #   environment:
  #     - S3_ENDPOINT
  #     - S3_ACCESS_KEY_ID
  #     - S3_SECRET_ACCESS_KEY
